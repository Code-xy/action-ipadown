name: win-unpack

on:
  workflow_dispatch:
  push:
    branches-ignore: ['results']

permissions:
  contents: write

jobs:
  unpack:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: prepare-target
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          New-Item -ItemType Directory -Force -Path work | Out-Null
          $local = Get-ChildItem -Recurse -File -Include *.zip,*.exe |
                   Where-Object { $_.FullName -notmatch '\\work\\' -and ($_.Name -like 'yuntui*' -or $_.Name -like '*云推*') } |
                   Select-Object -First 1
          if ($local) {
            Write-Host "using repo file: $($local.FullName)"
            Copy-Item $local.FullName work\ -Force
          } else {
            $u='http://softupdate1.maposafe.com/uploads/7974449/5236313/%E4%BA%91%E6%8E%A8%E5%86%85%E9%83%A8%E7%89%88PLUS10.26.zip'
            Write-Host "downloading from upstream ..."
            curl.exe -L --retry 3 --retry-delay 5 --max-time 600 -o work\target.zip "$u"
          }
          Get-ChildItem work\*.zip -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "expand $($_.Name)"
            Expand-Archive -Path $_.FullName -DestinationPath work -Force
          }
          Get-ChildItem work -Recurse -File | Unblock-File -ErrorAction SilentlyContinue
          Get-ChildItem work -Recurse -File | Select-Object Name,Length | Format-Table -AutoSize
          if (-not (Get-ChildItem work -Recurse -File -Include *.exe)) {
            Write-Host "##[error] 目标 EXE 未就位：上游下载失败，需要把 zip 提交进仓库"
            exit 1
          }

      - name: fetch-unpackers
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          curl.exe -L --retry 5 --retry-delay 5 -o pe-sieve64.exe      https://github.com/hasherezade/pe-sieve/releases/latest/download/pe-sieve64.exe
          curl.exe -L --retry 5 --retry-delay 5 -o hollows_hunter64.exe https://github.com/hasherezade/hollows_hunter/releases/latest/download/hollows_hunter64.exe
          Get-ChildItem *.exe | Select-Object Name,Length | Format-Table -AutoSize

      - name: run-and-dump
        shell: pwsh
        run: |
          $exe = (Get-ChildItem work\*.exe | Select-Object -First 1).FullName
          Write-Host "target = $exe"
          .\tools\dump.ps1 -Exe $exe -Out out -Pesieve ".\pe-sieve64.exe" -Seconds 45
          Write-Host "--- dump summary ---"
          Get-ChildItem -Recurse out -File | ForEach-Object {
            $fs=[IO.File]::OpenRead($_.FullName); $b=New-Object byte[] 32
            $n=$fs.Read($b,0,32); $fs.Close()
            "{0,-58} {1,10}  head={2}" -f $_.Name, $_.Length, (($b[0..([Math]::Min(15,$n-1))] | ForEach-Object { $_.ToString('x2') }) -join ' ')
          } | Tee-Object -FilePath out\summary.txt

      - name: hollows-hunter-scan
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path out\hh | Out-Null
          .\hollows_hunter64.exe /dir out\hh /quiet 2>&1 | Tee-Object -FilePath out\hh_log.txt
          Get-ChildItem -Recurse out\hh -File -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize

      - name: publish-results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          Copy-Item out\*  results\ -Recurse -Force -ErrorAction SilentlyContinue
          @(
            "repo=$env:GITHUB_REPOSITORY",
            "run_id=$env:GITHUB_RUN_ID",
            "sha=$env:GITHUB_SHA",
            "ref=$env:GITHUB_REF",
            "runner=$env:RUNNER_OS $env:RUNNER_ARCH",
            "time=$((Get-Date).ToUniversalTime().ToString('s'))Z"
          ) | Out-File results\RUN.txt -Encoding utf8
          if (Test-Path results) { Compress-Archive -Path results\* -DestinationPath dumps.zip -Force -ErrorAction SilentlyContinue }
          git config user.email "actions@users.noreply.github.com"
          git config user.name  "github-actions"
          git checkout -B results
          git add -f results dumps.zip
          git commit -m "unpack results: run $env:GITHUB_RUN_ID" 
          git push -f "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" results
          Write-Host "pushed branch 'results'"

      - name: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unpack-dumps
          path: out/**
          if-no-files-found: warn
          compression-level: 1
